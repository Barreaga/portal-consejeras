<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi panel - Portal de Consejeras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark barra-principal">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Portal de Consejeras</span>
      <div>
        <span class="text-white me-3" id="nombre-consejera"></span>
        <button id="btn-salir" class="btn btn-light btn-sm">Cerrar sesion</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <h2 class="titulo-seccion mb-4">Hola, <span id="saludo"></span></h2>

    <div class="row g-4 mb-4">

      <div class="col-md-4">
        <div class="card p-3 text-center">
          <p class="text-muted mb-1">Productos en tu pedido</p>
          <h3 class="titulo-seccion mb-0" id="cantidad-lineas">0</h3>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3 text-center">
          <p class="text-muted mb-1">Total del pedido</p>
          <h3 class="titulo-seccion mb-0" id="total-pedido">Q0.00</h3>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3 text-center">
          <p class="text-muted mb-1">Pedido minimo</p>
          <h3 class="titulo-seccion mb-0">Q400.00</h3>
        </div>
      </div>

    </div>

    <div id="aviso-minimo" class="alert alert-warning d-none" role="alert"></div>

    <a href="catalogo.html" class="btn btn-lg text-white" style="background-color:#6b3f69;">
      Ir al catalogo
    </a>

  </div>

  <script src="js/pedido.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
