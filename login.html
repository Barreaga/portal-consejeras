<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion - Portal de Consejeras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark barra-principal">
    <div class="container">
      <a href="index.html" class="navbar-brand mb-0 h1">Portal de Consejeras</a>
    </div>
  </nav>

  <div class="container" style="max-width: 420px; margin-top: 60px;">
    <div class="card p-4">
      <h3 class="titulo-seccion text-center mb-4">Iniciar sesion</h3>

      <div class="mb-3">
        <label for="codigo" class="form-label">Codigo de consejera</label>
        <input type="text" class="form-control" id="codigo" placeholder="Ejemplo: C001">
      </div>

      <div class="mb-3">
        <label for="clave" class="form-label">Contrasena</label>
        <input type="password" class="form-control" id="clave">
      </div>

      <div id="mensaje" class="alert alert-danger d-none" role="alert"></div>

      <button id="btn-entrar" class="btn text-white w-100" style="background-color:#6b3f69;">
        Entrar
      </button>

      <p class="text-muted small mt-3 mb-0 text-center">
        <a href="recuperar.html" class="text-decoration-none">Olvide mi contrasena</a>
      </p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
